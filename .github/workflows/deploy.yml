name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy HTML files to VPS
        run: |
          echo "${{ secrets.VPS_SSH_KEY }}" > /tmp/vps_key
          chmod 600 /tmp/vps_key
          scp -i /tmp/vps_key -o StrictHostKeyChecking=no index.html okk.html root@195.208.119.67:/var/www/okk/
          rm /tmp/vps_key
