name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build sales dashboard
        run: |
          cd sales
          npm ci
          npm run build

      - name: Deploy all files to VPS
        run: |
          echo "${{ secrets.VPS_SSH_KEY }}" > /tmp/vps_key
          chmod 600 /tmp/vps_key
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitattributes' \
            --exclude='tasks/api/tasks.db' \
            --exclude='tasks/api/ai_url.json' \
            --exclude='tasks/api/.venv' \
            --exclude='tasks/api/attachments' \
            --exclude='tasks/api/vosk-model' \
            --exclude='**/__pycache__' \
            --exclude='sales/node_modules' \
            --exclude='sales/src' \
            --exclude='sales/dist' \
            -e "ssh -i /tmp/vps_key -o StrictHostKeyChecking=no" \
            . root@195.208.119.67:/var/www/okk/

          # Перекрываем sales/ собранным prod-бандлом (dist/index.html + assets/ + data/).
          # Без --delete: оставляем on-the-fly загруженные CSV в sales/public/data/.
          rsync -avz \
            -e "ssh -i /tmp/vps_key -o StrictHostKeyChecking=no" \
            sales/dist/ root@195.208.119.67:/var/www/okk/sales/
          rm /tmp/vps_key

      - name: Upload Google service account credentials
        run: |
          echo "${{ secrets.VPS_SSH_KEY }}" > /tmp/vps_key
          chmod 600 /tmp/vps_key
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_INFO }}' | \
            ssh -i /tmp/vps_key -o StrictHostKeyChecking=no \
              root@195.208.119.67 \
              'cat > /var/www/okk/recruiter/service_account.json && chmod 600 /var/www/okk/recruiter/service_account.json'
          rm /tmp/vps_key

      - name: Run server setup (nginx + Ollama + Recruiter service)
        run: |
          echo "${{ secrets.VPS_SSH_KEY }}" > /tmp/vps_key
          chmod 600 /tmp/vps_key
          ssh -i /tmp/vps_key -o StrictHostKeyChecking=no \
            root@195.208.119.67 \
            'bash /var/www/okk/scripts/setup-server.sh'
          rm /tmp/vps_key

      - name: Smoke test (проверка что портал и звонилка живы)
        run: |
          echo "Жду 8 сек чтобы tasks-api поднялся после рестарта..."
          sleep 8
          BASE="https://portalsth.ru/tasks/api"
          fail=0

          # 1. Базовый health
          code=$(curl -sS -m 10 -o /dev/null -w "%{http_code}" "$BASE/health" || echo 000)
          echo "health: $code"
          [ "$code" = "200" ] || { echo "❌ /health не 200"; fail=1; }

          # 2. AI health (Ollama через туннель)
          curl -sS -m 10 "$BASE/ai/health" || true
          echo ""

          # 3. Voicecall TTS (Edge) — главный эндпоинт теста, ASCII-текст
          code=$(curl -sS -m 20 -o /tmp/tts_smoke.bin -w "%{http_code}" \
            "$BASE/voicecall/tts?text=test&voice=ru-RU-SvetlanaNeural" || echo 000)
          size=$(stat -c%s /tmp/tts_smoke.bin 2>/dev/null || echo 0)
          echo "voicecall/tts edge: HTTP $code, $size bytes"
          # Должен быть аудио (>1КБ), не JSON-ошибка
          if [ "$code" != "200" ] || [ "$size" -lt 1000 ]; then
            echo "❌ TTS не вернул аудио. Ответ:"; head -c 300 /tmp/tts_smoke.bin; echo
            fail=1
          fi

          # 4. Старт тестовой сессии валидатора
          code=$(curl -sS -m 10 -o /tmp/vc_start.json -w "%{http_code}" \
            -X POST "$BASE/voicecall/test/start" || echo 000)
          echo "voicecall/test/start: HTTP $code"
          [ "$code" = "200" ] || { echo "❌ test/start не 200"; head -c 300 /tmp/vc_start.json; fail=1; }

          if [ "$fail" = "1" ]; then
            echo "::error::Смоук-тест звонилки провалился — деплой сломал эндпоинты"
            exit 1
          fi
          echo "✅ Смоук-тест пройден: портал и звонилка живы"
