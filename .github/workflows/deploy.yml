name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy all files to VPS
        run: |
          echo "${{ secrets.VPS_SSH_KEY }}" > /tmp/vps_key
          chmod 600 /tmp/vps_key
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitattributes' \
            -e "ssh -i /tmp/vps_key -o StrictHostKeyChecking=no" \
            . root@195.208.119.67:/var/www/okk/
          rm /tmp/vps_key

      - name: Configure nginx hh.ru proxy
        run: |
          echo "${{ secrets.VPS_SSH_KEY }}" > /tmp/vps_key
          chmod 600 /tmp/vps_key
          ssh -i /tmp/vps_key -o StrictHostKeyChecking=no root@195.208.119.67 '
            # Write hh.ru proxy location config
            cat > /etc/nginx/snippets/hh-proxy.conf << "EOF"
location /api/hh/ {
    resolver 8.8.8.8 valid=30s;
    set $hh_url "";
    if ($arg_url) {
        set $hh_url $arg_url;
    }
    proxy_pass $hh_url;
    proxy_set_header Host hh.ru;
    proxy_set_header User-Agent "Mozilla/5.0 (compatible; STH-KP/1.0)";
    proxy_ssl_server_name on;
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    proxy_cache_valid 200 10m;
}
EOF
            # Include snippet in site config if not already included
            CONF=$(nginx -T 2>/dev/null | grep -l "hh-proxy" /etc/nginx/sites-enabled/* 2>/dev/null | head -1)
            if [ -z "$CONF" ]; then
              SITE=$(ls /etc/nginx/sites-enabled/ | head -1)
              if [ -n "$SITE" ]; then
                sed -i "/server {/a\\    include snippets/hh-proxy.conf;" /etc/nginx/sites-enabled/$SITE 2>/dev/null || true
              fi
            fi
            nginx -t && systemctl reload nginx && echo "nginx reloaded OK"
          '
          rm /tmp/vps_key
