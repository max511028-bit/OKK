name: Sync Finance Dashboard

on:
  schedule:
    # Every day at 06:00 UTC (09:00 Moscow)
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download latest finance dashboard
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/max511028-bit/finance/main/sth_dashboard.html" \
            -o finance/index.html

      - name: Inject password protection
        run: python3 scripts/inject_auth.py finance/index.html

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add finance/index.html
          if git diff --cached --quiet; then
            echo "No changes — finance dashboard is up to date"
          else
            git commit -m "sync: update finance dashboard"
            git push
          fi
