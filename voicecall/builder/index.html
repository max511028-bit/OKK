<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>СТХ — Конструктор скриптов</title>
<style>
  :root{
    --bg:#0f1115; --surface:#171a21; --surface2:#1e222b; --line:#2a2f3a;
    --text:#e8eaed; --muted:#9aa0ab; --hint:#6b7280;
    --accent:#3b82f6; --accent-soft:#16243d;
    --ok:#22c55e; --ok-soft:#13301d; --bad:#ef4444; --bad-soft:#34191a;
    --warn:#f59e0b; --warn-soft:#332408; --pending:#65d6ff; --pending-soft:#10212b;
    --radius:12px; --radius-sm:8px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.5;
    -webkit-font-smoothing:antialiased; padding:16px;
  }
  .wrap{max-width:900px; margin:0 auto}
  .topnav{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:13px;color:var(--muted);}
  .topnav a{color:var(--muted);text-decoration:none;}
  .topnav a:hover{color:var(--text);}
  h1{font-size:22px; font-weight:600; margin:0 0 4px}
  .sub{font-size:13px; color:var(--muted); margin:0 0 24px}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px; margin-bottom:16px;}

  button{
    font-family:inherit; font-size:13px; color:var(--text); background:var(--surface2);
    border:1px solid var(--line); border-radius:var(--radius-sm); padding:9px 14px; cursor:pointer;
    transition:background .12s, border-color .12s; display:inline-flex; align-items:center; gap:6px;
  }
  button:hover:not(:disabled){background:#262b36; border-color:#3a4150}
  button:disabled{opacity:.45; cursor:not-allowed}
  button.primary{background:var(--accent); border-color:var(--accent); color:#fff}
  button.primary:hover:not(:disabled){background:#2f6fd6}
  button.danger{background:var(--bad-soft); border-color:#5a2626; color:#f59a9a}
  button.danger:hover:not(:disabled){background:#3e1818}
  button.small{font-size:12px; padding:6px 10px}

  input[type=text], input[type=password]{
    font-family:inherit; font-size:14px; padding:9px 12px; background:var(--bg);
    border:1px solid var(--line); border-radius:8px; color:var(--text); outline:none;
  }
  input:focus{border-color:var(--accent)}

  .lib{display:grid; gap:10px}
  .lib-item{background:var(--surface2); border:1px solid var(--line); border-radius:var(--radius-sm); padding:12px 14px;}
  .lib-head{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
  .lib-title{font-weight:600; font-size:14px}
  .lib-meta{font-size:12px; color:var(--muted)}
  .lib-stats{margin-left:auto}
  .pill{font-size:11px; font-weight:600; padding:3px 8px; border-radius:8px;}
  .pill.published{background:var(--ok-soft); color:#7ee29a}
  .pill.draft{background:var(--pending-soft); color:var(--pending)}

  .empty{text-align:center; color:var(--hint); font-size:13px; padding:30px 0}
  .loading{text-align:center; color:var(--muted); padding:20px 0; font-size:13px}
  .err{color:var(--bad); font-size:12px; margin-top:8px;}
</style>
</head>
<body>
<div class="wrap">

  <div class="topnav">
    <a href="/">← Портал СТХ</a> <span>·</span>
    <a href="/voicecall/">Голосовой обзвон</a> <span>·</span>
    <span>Конструктор скриптов</span>
  </div>

  <h1>⚙️ Конструктор скриптов</h1>
  <p class="sub">Библиотека сценариев обзвона. Создавай, копируй, редактируй скрипты без программиста.</p>

  <!-- Парольный гейт -->
  <div class="card" id="authCard">
    <div style="font-size:14px;margin-bottom:10px;">🔒 Введи пароль портала для доступа к конструктору:</div>
    <div style="display:flex;gap:8px;max-width:400px;">
      <input type="password" id="password" placeholder="Пароль" style="flex:1;" onkeydown="if(event.key==='Enter')checkAuth()">
      <button class="primary" onclick="checkAuth()">Войти</button>
    </div>
    <div id="authErr" class="err" style="display:none;"></div>
  </div>

  <!-- Библиотека (после входа) -->
  <div class="card" id="libCard" style="display:none;">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
      <h2 style="font-size:16px;font-weight:600;margin:0;">📚 Библиотека скриптов</h2>
      <button class="primary small" style="margin-left:auto;" onclick="createNew()">+ Создать скрипт</button>
      <button class="small" onclick="loadList()">↻ Обновить</button>
    </div>
    <div id="list" class="lib"><div class="loading">Загрузка...</div></div>
  </div>

</div>

<script>
"use strict";
var API = "/tasks/api";
var PASSWORD = null;

function escHtml(s){
  return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function fmtTs(iso){
  if(!iso) return "";
  var d = new Date(iso);
  if(isNaN(d.getTime())) return iso;
  return d.getDate()+"."+String(d.getMonth()+1).padStart(2,"0")+"."+d.getFullYear()
    + " " + String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}

async function checkAuth(){
  var pwd = document.getElementById("password").value;
  var err = document.getElementById("authErr");
  err.style.display = "none";
  if(!pwd){ err.textContent = "Введи пароль"; err.style.display = "block"; return; }
  try{
    var r = await fetch(API + "/auth/check", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: pwd, kind: "portal" })
    });
    if(!r.ok){
      err.textContent = r.status === 403 ? "Неверный пароль" : ("Ошибка " + r.status);
      err.style.display = "block"; return;
    }
    PASSWORD = pwd;
    document.getElementById("authCard").style.display = "none";
    document.getElementById("libCard").style.display = "block";
    loadList();
  }catch(e){
    err.textContent = "Сеть: " + e.message; err.style.display = "block";
  }
}

async function loadList(){
  var list = document.getElementById("list");
  list.innerHTML = "<div class='loading'>Загрузка библиотеки...</div>";
  try{
    var r = await fetch(API + "/voicecall/scripts");
    var data = await r.json();
    var items = data.items || [];
    if(!items.length){
      list.innerHTML = "<div class='empty'>Скриптов пока нет. Создай первый.</div>";
      return;
    }
    list.innerHTML = items.map(function(s){
      var pill = s.status === "published"
        ? "<span class='pill published'>✓ опубликован</span>"
        : "<span class='pill draft'>✎ черновик</span>";
      return ""
        + "<div class='lib-item'>"
        + "  <div class='lib-head'>"
        + "    <div>"
        + "      <div class='lib-title'>" + escHtml(s.name) + "</div>"
        + "      <div class='lib-meta'>id: " + escHtml(s.id) + " · шагов: " + s.steps_count + " · v" + s.version + " · изменён " + fmtTs(s.updated_at) + "</div>"
        + "    </div>"
        + "    <div class='lib-stats'>" + pill + "</div>"
        + "  </div>"
        + "  <div style='margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;'>"
        + "    <button class='small' disabled title='Будет на следующем этапе'>✎ Редактировать</button>"
        + "    <button class='small' onclick=\"copyScript('" + escHtml(s.id) + "')\">⧉ Копия</button>"
        + "    <button class='small danger' onclick=\"deleteScript('" + escHtml(s.id) + "')\">🗑 Удалить</button>"
        + "  </div>"
        + "</div>";
    }).join("");
  }catch(e){
    list.innerHTML = "<div class='empty'>Ошибка: " + escHtml(e.message) + "</div>";
  }
}

async function createNew(){
  var name = prompt("Название нового скрипта:", "Новый скрипт");
  if(!name) return;
  try{
    var r = await fetch(API + "/voicecall/scripts?password=" + encodeURIComponent(PASSWORD), {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: name, steps: [], stop_factors: [], closing: "Спасибо! Все вопросы заданы, до свидания." })
    });
    if(!r.ok){ alert("Не удалось создать: HTTP " + r.status); return; }
    loadList();
  }catch(e){ alert("Ошибка: " + e.message); }
}

async function copyScript(sid){
  try{
    var r = await fetch(API + "/voicecall/scripts/" + encodeURIComponent(sid) + "/copy?password=" + encodeURIComponent(PASSWORD), { method: "POST" });
    if(!r.ok){ alert("Не удалось скопировать: HTTP " + r.status); return; }
    loadList();
  }catch(e){ alert("Ошибка: " + e.message); }
}

async function deleteScript(sid){
  if(!confirm("Удалить скрипт «" + sid + "»? Действие необратимо.")) return;
  try{
    var r = await fetch(API + "/voicecall/scripts/" + encodeURIComponent(sid) + "?password=" + encodeURIComponent(PASSWORD), { method: "DELETE" });
    if(!r.ok){ alert("Не удалось удалить: HTTP " + r.status); return; }
    loadList();
  }catch(e){ alert("Ошибка: " + e.message); }
}
</script>
</body>
</html>
