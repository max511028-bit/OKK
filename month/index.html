/* ============ STH GLOBAL MOBILE OVERRIDES ============ */
@media (max-width: 768px) {
  html, body { font-size: 14px; }
  /* Любой grid с >=2 колонками → 1 колонка */
  [class*="grid"], [class*="-grid"] {
    grid-template-columns: 1fr !important;
    gap: 12px !important;
  }
  /* Таблицы — горизонтальный скролл через обёртку, либо сама таблица */
  table {
    display: block;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    white-space: nowrap;
    max-width: 100%;
  }
  /* Большие падинги/маргины ужать */
  .container, main, .main, .content, .page-content {
    padding-left: 12px !important;
    padding-right: 12px !important;
  }
  /* Заголовки тише */
  h1 { font-size: 22px !important; line-height: 1.25; }
  h2 { font-size: 18px !important; line-height: 1.3; }
  h3 { font-size: 16px !important; }
  /* Сайдбар/навигация — на всю ширину сверху */
  aside, .sidebar, nav.side, .side-nav {
    position: static !important;
    width: 100% !important;
    height: auto !important;
    border-right: 0 !important;
    border-bottom: 1px solid rgba(255,255,255,.08);
  }
  /* Кнопки потолще для пальцев */
  button, .btn, [role="button"] {
    min-height: 40px;
  }
  /* Карточки KPI — на всю ширину */
  .card, .kpi, .metric, .stat-card, .stat {
    width: 100% !important;
    min-width: 0 !important;
  }
  /* Графики — никогда не вылезают за экран */
  canvas, svg, .chart, [class*="chart"] {
    max-width: 100% !important;
    height: auto !important;
  }
}

@media (max-width: 480px) {
  html, body { font-size: 13px; }
  h1 { font-size: 19px !important; }
  h2 { font-size: 16px !important; }
  /* AI-панель — почти fullscreen */
  #_ai_panel, #_tai_panel {
    width: calc(100vw - 16px) !important;
    height: calc(100vh - 100px) !important;
    bottom: 80px !important;
    right: 8px !important;

    max-width: none !important;
    max-height: none !important;

    bottom: 16px !important;
    right: 16px !important;
    width: 50px !important;
    height: 50px !important;

  /* Плашка «ИИ оффлайн» — мельче чтоб не съедала пол-экрана */
  #_sth_ai_offline_banner {
    font-size: 11px !important;
    padding: 6px 10px !important;

  /* Скрываем длинные subtitle/decoration на самых мелких */
  .subtitle, .desc-long, .label-decoration { display: none; }
  /* Padding ещё уменьшаем */
  .container, main, .main, .content, .page-content,
  .panel, .section, section {
    padding: 8px !important;
  }
}

/* На любых размерах если viewport узкий — таблицы прокручиваются */
@media (max-width: 1024px) {
  .table-wrap, .table-container {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
}

(function(){
  var K='p_auth';
  if(sessionStorage.getItem(K))return;
  document.addEventListener('DOMContentLoaded',function(){
    var o=document.createElement('div');
    o.id='_pov';
    o.style.cssText='position:fixed;inset:0;background:#0d1117;display:flex;align-items:center;justify-content:center;z-index:2147483647;font-family:Inter,system-ui,sans-serif';
    o.innerHTML='<div style="background:#161b22;border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:44px 40px;width:360px;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.6)">'
      +'<div style="font-size:42px;margin-bottom:18px">🔒</div>'
      +'<div style="font-size:22px;font-weight:700;color:#f0f6fc;margin-bottom:8px">Доступ закрыт</div>'
      +'<div style="font-size:14px;color:#8b949e;margin-bottom:28px">Введите пароль для входа</div>'
      +'<input id="_pi" type="password" placeholder="Пароль" style="width:100%;padding:13px 16px;background:#0d1117;border:1px solid rgba(255,255,255,.15);border-radius:10px;color:#f0f6fc;font-size:15px;outline:none;margin-bottom:10px;box-sizing:border-box" />'
      +'<div id="_pe" style="color:#f85149;font-size:13px;margin-bottom:12px;min-height:18px"></div>'
      +'<button id="_pb" style="width:100%;padding:13px;background:#238636;border:none;border-radius:10px;color:#fff;font-size:15px;font-weight:600;cursor:pointer">Войти</button>'
      +'</div>';
    document.body.appendChild(o);
    setTimeout(function(){var pi=document.getElementById('_pi'); if(pi) pi.focus();},80);
    function submit(){
      var pi=document.getElementById('_pi'); var pe=document.getElementById('_pe'); var pb=document.getElementById('_pb');
      var v=pi.value; if(!v) return;
      pb.disabled=true; pb.textContent='…';
      fetch('/tasks/api/auth/check',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({password:v,kind:'portal'})
      }).then(function(r){
        if(r.ok) return r.json();
        throw new Error(r.status===403?'Неверный пароль':'Ошибка '+r.status);
      }).then(function(d){
        if(d&&d.token){sessionStorage.setItem(K,d.token); var ov=document.getElementById('_pov'); if(ov) ov.remove();}
        else throw new Error('Нет токена');
      }).catch(function(e){
        pe.textContent=e.message||'Ошибка'; pi.value=''; pi.focus();
        pb.disabled=false; pb.textContent='Войти';
      });
    }
    document.getElementById('_pi').addEventListener('keydown',function(e){if(e.key==='Enter')submit();});
    document.getElementById('_pb').addEventListener('click',submit);
  });
})();

<script>
(function() {
  const URL = '/tasks/api/ai/health';
  const EL = () => document.getElementById('_sth_ai_offline_banner');
  let _lastOnline = null;
  async function _check() {
    try {
      const r = await fetch(URL, { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const d = await r.json();
      const online = !!d.online;
      const el = EL();
      if (el) el.classList.toggle('show', !online);
      _lastOnline = online;
    } catch (e) {
      const el = EL();
      if (el) el.classList.add('show');
    }
  }
  // Первая проверка через 2 сек после загрузки, далее раз в 60 сек
  document.addEventListener('DOMContentLoaded', function() {
    setTimeout(_check, 2000);
    setInterval(_check, 60000);
  });
})();
</script>

<script>

// ===== AI FLOATING PANEL (MONTH) =====
(function(){
const _SUGGS = ["Какие проекты в красной зоне в последнем месяце?","Где сильнее всего просел % закрытия заявки?","Топ-3 драйвера роста за месяц","Где штрафы выше 3% от выручки?","Динамика воронки подбора по дивизионам","Какие проекты впервые выполнили KPI?","Кто провалил «10 смен» сильнее всего?","Где стоимость целевого лида >900р?","Сравни прошлый и текущий месяц по марже","Дай план действий по слабым проектам"];
const _OLLAMA='/tasks/api/ai/proxy';
const _DASH_TYPE='month';
let _hist=[], _models=[], _open=false, _dynPrompt=null;

async function _loadDynPrompt(){
  try{
    const r=await fetch('/tasks/api/ai/prompt/'+_DASH_TYPE);
    if(r.ok){const d=await r.json();_dynPrompt=d.prompt||null;}
  }catch{}
}

function _aiBuildCtx(){
  try{
    if(typeof state==='undefined'||!state.data)return '=== ИТОГИ МЕСЯЦА === (данные ещё загружаются)';
    var lines=['=== ИТОГИ МЕСЯЦА STH ==='];
    var reports=state.data.reports||[];
    var lastTwo=reports.slice(-2);
    lastTwo.forEach(function(r){
      lines.push('--- '+r.label+' ('+(r.projects||[]).length+' проектов) ---');
      var bottom=(r.projects||[]).slice().sort(function(a,b){return ((typeof health==='function'?health(a):0)) - ((typeof health==='function'?health(b):0));}).slice(0,8);
      bottom.forEach(function(p){
        var m=p.metrics||{};
        var rev=m.revenueVat?Math.round(m.revenueVat).toLocaleString('ru-RU')+'р':'—';
        var clo=m.requestCloseRate!=null?(m.requestCloseRate*100).toFixed(0)+'%':'—';
        var pen=m.penaltyShare!=null?(m.penaltyShare*100).toFixed(1)+'%':'—';
        lines.push(p.name+' ['+(p.division||'?')+']: выручка '+rev+', закрытие '+clo+', штраф '+pen);
      });
    });
    var acts=(state.actions||[]).slice(0,15);
    if(acts.length){
      lines.push('--- ДЕЙСТВИЯ/БЛОКЕРЫ ---');
      acts.forEach(function(a){lines.push('• '+a.projectName+' / '+a.department+' / '+a.kind+': '+(a.text||'').slice(0,100));});
    }
    return lines.join('\n');
  }catch(e){return '=== ИТОГИ МЕСЯЦА === (ошибка: '+e.message+')';}
}

function _fmtAI(t){
  t=t.replace(/[\u4e00-\u9fff\u3040-\u30ff]{1,3}(?=\s|[\u0400-\u04ff])/g,'');
  t=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const tr=/(\.+\|\n)((?:\|[-:])+\|\n)((?:\|.+\|\n?)+)/g;
  t=t.replace(tr,function(_,h,s,b){
    const hc=h.split('|').filter(c=>c.trim()).map(c=>`<th>${c.trim()}</th>`).join('');
    const rows=b.trim().split('\n').map(r=>{const cells=r.split('|').filter(c=>c.trim()).map(c=>`<td>${c.trim()}</td>`).join('');return`<tr>${cells}</tr>`;}).join('');
    return`<table><thead><tr>${hc}</tr></thead><tbody>${rows}</tbody></table>`;
  });
  return t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/^- (.+)$/gm,'• $1')
    .replace(/\n/g,'<br>');
}

function _addMsg(role,html){
  const box=document.getElementById('_ai_msgs');
  if(!box)return null;
  const d=document.createElement('div');
  d.className='_ai_msg '+role;
  d.innerHTML=html;
  box.appendChild(d);
  box.scrollTop=box.scrollHeight;
  return d;
}

async function _loadModels(){
  const sel=document.getElementById('_ai_model_sel');
  if(!sel)return;
  sel.innerHTML='<option>⏳ Загрузка...</option>';
  try{
    const r=await fetch(_OLLAMA+'/tags');
    if(!r.ok)throw new Error('HTTP '+r.status);
    const data=await r.json();
    _models=(data.models||[]).map(m=>m.name).sort();
    if(!_models.length)throw new Error('Нет моделей на сервере');
    sel.innerHTML=_models.map(m=>`<option value="${m}">${m}</option>`).join('');
    const pref=['qwen3:8b','qwen3:30b','qwen3-coder-next:cloud','minimax-m2.7:cloud','llama3.2:3b'];
    const def=pref.find(p=>_models.includes(p))||_models[0];
    sel.value=def;
  }catch(e){
    const sel2=document.getElementById('_ai_model_sel');
    if(sel2){sel2.innerHTML='<option value="">⚠️ '+(e.message||'Ошибка')+' — клик для повтора</option>';sel2.onclick=function(){if(!_models.length){sel2.onclick=null;_loadModels();}};}
  }
}

async function _ask(msg){
  const btn=document.getElementById('_ai_send');
  const inp=document.getElementById('_ai_inp');
  if(btn)btn.disabled=true;
  if(inp)inp.disabled=true;
  _addMsg('user',_fmtAI(msg));
  const thinking=_addMsg('bot','<span>⏳ Анализирую...</span>');
  let reply='';
  try{
    const model=document.getElementById('_ai_model_sel')?.value||'';
    if(!model)throw new Error('Выберите модель');
    const _ctxRaw=_aiBuildCtx();
    const _ctx=(_ctxRaw&&typeof _ctxRaw.then==='function')?(await _ctxRaw):_ctxRaw;
    const sysContent=(_dynPrompt||`Ты — AI-аналитик дашборда «Итоги месяца». Видишь помесячные отчёты STH по проектам:
выручка, штрафы, % закрытия заявок, проверка СУПР, воронка подбора, ФОТ, маркетинг.

Правила:
- Отвечай ТОЛЬКО на русском.
- Используй ТОЛЬКО цифры из контекста.
- Если данных нет — прямо скажи.
- Без приветствий вроде «Конечно!».

Формат: Факты (с цифрами и именами проектов) → Вывод → Рекомендация. Максимум 8 предложений.
Используй **жирный** для названий проектов и ключевых чисел.

АКТУАЛЬНЫЕ ДАННЫЕ:
`)+_ctx;
    const messages=[{role:'system',content:sysContent},..._hist.map(h=>h)];
    messages.push({role:'user',content:msg});
    const payload={model,messages,stream:true,think:false};
    const res=await fetch(_OLLAMA+'/chat/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const reader=res.body.getReader();
    const dec=new TextDecoder();
    let buf='';
    if(thinking)thinking.innerHTML='▍';
    while(true){
      const {done,value}=await reader.read();
      if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n');buf=lines.pop();
      for(const line of lines){
        if(!line.trim())continue;
        try{
          const c=JSON.parse(line);
          if(c.error)throw new Error(c.error);
          const p=c.message?.content||'';
          if(p){reply+=p;if(thinking)thinking.innerHTML=_fmtAI(reply)+'<span style="animation:blink 1s step-end infinite">▍</span>';}
        }catch(e2){if(e2.message&&!e2.message.includes('JSON'))throw e2;}
      }
    }
    if(thinking)thinking.innerHTML=_fmtAI(reply);
    _hist.push({role:'user',content:msg},{role:'assistant',content:reply});
    if(_hist.length>20)_hist.splice(0,2);
  }catch(e){
    if(thinking){const sp=document.createElement('span');sp.style.color='#f85149';sp.textContent='⚠️ '+(e.message||'Ошибка');thinking.innerHTML='';thinking.appendChild(sp);}
  }
  if(btn)btn.disabled=false;
  if(inp){inp.disabled=false;inp.focus();}
  const box=document.getElementById('_ai_msgs');
  if(box)box.scrollTop=box.scrollHeight;
}

function _send(){
  const inp=document.getElementById('_ai_inp');
  if(!inp)return;
  const msg=inp.value.trim();
  if(!msg)return;
  inp.value='';
  _ask(msg);
}

function _chip(txt){
  const inp=document.getElementById('_ai_inp');
  if(inp)inp.value=txt;
  _send();
}

function _toggle(){
  _open=!_open;
  const panel=document.getElementById('_ai_panel');
  if(panel)panel.style.display=_open?'flex':'none';
  if(_open&&!_models.length){setTimeout(_loadModels,50);_loadDynPrompt();}
}

function _clear(){
  _hist=[];
  const box=document.getElementById('_ai_msgs');
  if(box)box.innerHTML='<div class="_ai_msg bot">Привет! Я анализирую помесячные отчёты по проектам — выручку, штраф, воронку, маркетинг.<br><br>Спросите про драйверы/блокеры, провалы KPI, динамику дивизионов.</div>';
  const chips=document.getElementById('_ai_chips');
  if(chips)chips.style.display='flex';
}

// Health-check плашка живёт в STH_AI_HEALTH_BANNER (см. index.html и инжект на всех
// страницах) — здесь свою больше не ставим, чтобы не было двух красных баров.

`;
  document.head.appendChild(st);

  // Button
  const btn=document.createElement('button');
  btn.id='_ai_btn';
  btn.innerHTML='🤖';
  btn.title='Аналитик месяца';
  btn.onclick=_toggle;
  document.body.appendChild(btn);

  // Panel
  const panel=document.createElement('div');
  panel.id='_ai_panel';
  const suggs_html=_SUGGS.map(s=>`<span class="_ai_chip" onclick="_chip('${s}')">${s}</span>`).join('');
  panel.innerHTML=`
    <div id="_ai_panel_head">
      <span style="font-size:20px">🤖</span>
      <span class="ai-title">Аналитик месяца</span>
      <select id="_ai_model_sel"></select>

      <button id="_ai_close" onclick="_toggle()" title="Закрыть" style="background:none;border:none;color:#64748b;cursor:pointer;font-size:20px;padding:0 4px;">✕</button>
    </div>
    <div id="_ai_msgs">
      <div class="_ai_msg bot">Привет! Я анализирую помесячные отчёты по проектам — выручку, штраф, воронку, маркетинг.<br><br>Спросите про драйверы/блокеры, провалы KPI, динамику дивизионов.</div>
    </div>
    <div id="_ai_chips">${suggs_html}</div>
    <div id="_ai_inp_row">
      <textarea id="_ai_inp" rows="1" placeholder="Задайте вопрос..."></textarea>
      <button id="_ai_send" onclick="_send()">➤</button>
    </div>`;
  document.body.appendChild(panel);

  // Enter to send
  setTimeout(function(){
    const inp=document.getElementById('_ai_inp');
    if(inp)inp.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();_send();}});
  },100);

  // Hide chips after first use
  document.addEventListener('click',function(e){
    if(e.target.classList.contains('_ai_chip')){
      const chips=document.getElementById('_ai_chips');
      if(chips)chips.style.display='none';
    }
  });
});

window._chip=_chip;
window._toggle=_toggle;
window._clear=_clear;
})();

</script>
</body>
</html>
